[project]
name = "mesh"
version = "0.1.0"
description = "Telemetry collector for MeshCore repeaters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "meshcore>=2.3.10",
    "meshcore-cli>=1.6.3",
    "pyyaml>=6.0",
]

[project.scripts]
mesh-telemetry = "telemetry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telemetry"]
